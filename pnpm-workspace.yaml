allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20261110.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261110.1'
  - '@cloudflare/workerd-linux-64@1.20261110.1'
  - '@cloudflare/workerd-linux-arm64@1.20261110.1'
  - '@cloudflare/workerd-windows-64@1.20261110.1'
  - miniflare@5.20261110.0-beta
  - workerd@1.20261110.1
  - wrangler@4.160.0
  - '@better-auth/core@1.7.19'
  - '@better-auth/drizzle-adapter@1.7.19'
  - '@better-auth/kysely-adapter@1.7.19'
  - '@better-auth/memory-adapter@1.7.19'
  - '@better-auth/mongo-adapter@1.7.19'
  - '@better-auth/prisma-adapter@1.7.19'
  - '@better-auth/telemetry@1.7.19'
  - better-auth@1.7.19
overrides:
  # minimatch <11.0.1 has a denial-of-service bug (GHSA, Dependabot alert); glob@11 (via workbox-build,
  # build time only) still asks for ^10. Remove once workbox-build ships a fixed glob.
  'glob>minimatch': ^11.0.1
