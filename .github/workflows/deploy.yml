name: Deploy

# Every push to main: run the checks, migrate the production database, deploy the Worker, smoke
# test it, and roll the Worker back if the smoke test fails. A failed check or migration stops
# the run before anything is deployed.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never two deploys at once, and never cancel one halfway: a newer push waits its turn.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate and deploy
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # secrets and variables live in the GitHub environment "production"
    environment:
      name: production
      url: ${{ vars.SMOKE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, so a failed migration stops the run before any code is deployed. Migrations must be
      # additive (they also run while the previous Worker version is still live); see docs/infra.md.
      - name: Migrate the production database
        run: pnpm db:migrate --target prod
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}

      - name: Deploy the Worker
        id: deploy
        run: pnpm cf:deploy

      - name: Smoke test
        run: pnpm smoke
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}

      # Back to the previous Worker version when the new one does not answer. The database stays
      # migrated, which is why migrations have to work with both versions.
      - name: Roll back the Worker
        if: failure() && steps.deploy.outcome == 'success'
        run: pnpm exec wrangler rollback --yes --message "Smoke test failed for ${GITHUB_SHA::7}"
